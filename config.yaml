---
name: owserver (1-wire)
version: "1.0.0"
slug: owserver
description: 1-Wire server for DS9490 USB adapters
url: https://github.com/Kitsok/hassio-owserver
startup: system
init: false
arch:
  - amd64
  - aarch64
boot: auto
discovery:
  - onewire
ports:
  "4304/tcp": null
ports_description:
  "4304/tcp": "owserver 1-Wire (set port number to expose to LAN)"
usb: true
options:
  devices:
    - device_type: fake
  owhttpd: true
  temperature_scale: Celsius
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  devices:
    - device_type: list(usb|fake)
      device: device?
  owhttpd: bool
  temperature_scale: list(Celsius|Fahrenheit|Kelvin|Rankine)
  debug: bool?
ingress: true
panel_icon: mdi:alpha-w-box
image: ghcr.io/kitsok/owserver/{arch}
